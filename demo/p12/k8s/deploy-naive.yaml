apiVersion: apps/v1
kind: Deployment
metadata:
  name: clue-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: clue-api
  template:
    metadata:
      labels:
        app: clue-api
    spec:
      containers:
        - name: api
          image: clue-api:p12
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: clue-api-config
            - secretRef:
                name: clue-api-secret
          env:
            - name: CLUE_RELEASE
              value: v1
