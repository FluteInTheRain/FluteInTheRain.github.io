apiVersion: apps/v1
kind: Deployment
metadata:
  name: clue-api
spec:
  replicas: 3
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: clue-api
  template:
    metadata:
      labels:
        app: clue-api
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: clue-api:p12
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: clue-api-config
            - secretRef:
                name: clue-api-secret
          env:
            - name: CLUE_RELEASE
              value: v1
          startupProbe:
            httpGet:
              path: /livez
              port: 8000
            periodSeconds: 1
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            periodSeconds: 1
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /livez
              port: 8000
            periodSeconds: 10
            failureThreshold: 3
          lifecycle:
            preStop:
              sleep:
                seconds: 5
