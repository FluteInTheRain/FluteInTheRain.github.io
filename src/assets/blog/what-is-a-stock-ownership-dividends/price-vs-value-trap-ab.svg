<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" font-family="'Noto Sans','Helvetica Neue',Arial,sans-serif">
  <!-- outer card -->
  <rect x="8" y="8" width="1184" height="544" rx="20" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>

  <!-- title -->
  <text x="48" y="58" font-size="26" font-weight="700" fill="#0f172a">Which company is "cheaper"?</text>
  <text x="48" y="84" font-size="15" fill="#64748b">Illustrative — the price tag alone never tells you what you are buying a piece of</text>

  <!-- Company A card -->
  <rect x="48" y="108" width="520" height="360" rx="16" fill="#fff7ed" stroke="#fed7aa" stroke-width="2"/>
  <text x="80" y="148" font-size="21" font-weight="700" fill="#9a3412">Company A</text>
  <rect x="452" y="126" width="88" height="28" rx="14" fill="#ffffff" stroke="#fed7aa"/>
  <text x="496" y="145" font-size="13" font-weight="600" fill="#ea580c" text-anchor="middle">10,000 VND</text>

  <text x="80" y="200" font-size="15" fill="#9a3412">Price per slice</text>
  <text x="536" y="202" font-size="25" font-weight="700" fill="#7c2d12" text-anchor="end">10,000 VND</text>

  <text x="80" y="254" font-size="15" fill="#9a3412">Shares outstanding (slices)</text>
  <text x="536" y="256" font-size="25" font-weight="700" fill="#7c2d12" text-anchor="end">5,000,000,000</text>

  <text x="80" y="308" font-size="15" fill="#9a3412">Whole company (price × shares)</text>
  <text x="536" y="310" font-size="25" font-weight="700" fill="#0f172a" text-anchor="end">50,000 billion VND</text>

  <text x="80" y="356" font-size="13" fill="#b45309">a huge pizza, cut very thin — 5 billion slices</text>
  <rect x="80" y="376" width="456" height="18" rx="9" fill="#ffffff" stroke="#fed7aa"/>
  <rect x="80" y="376" width="456" height="18" rx="9" fill="#ea580c"/>

  <!-- equals -->
  <circle cx="600" cy="288" r="26" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="600" y="298" font-size="28" font-weight="700" fill="#475569" text-anchor="middle">=</text>

  <!-- Company B card -->
  <rect x="632" y="108" width="520" height="360" rx="16" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
  <text x="664" y="148" font-size="21" font-weight="700" fill="#1e40af">Company B</text>
  <rect x="1036" y="126" width="88" height="28" rx="14" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="1080" y="145" font-size="13" font-weight="600" fill="#2563eb" text-anchor="middle">100,000 VND</text>

  <text x="664" y="200" font-size="15" fill="#1e40af">Price per slice</text>
  <text x="1120" y="202" font-size="25" font-weight="700" fill="#1e3a8a" text-anchor="end">100,000 VND</text>

  <text x="664" y="254" font-size="15" fill="#1e40af">Shares outstanding (slices)</text>
  <text x="1120" y="256" font-size="25" font-weight="700" fill="#1e3a8a" text-anchor="end">500,000,000</text>

  <text x="664" y="308" font-size="15" fill="#1e40af">Whole company (price × shares)</text>
  <text x="1120" y="310" font-size="25" font-weight="700" fill="#0f172a" text-anchor="end">50,000 billion VND</text>

  <text x="664" y="356" font-size="13" fill="#1d4ed8">a smaller pizza, cut thick — 0.5 billion slices</text>
  <rect x="664" y="376" width="456" height="18" rx="9" fill="#ffffff" stroke="#bfdbfe"/>
  <rect x="664" y="376" width="46" height="18" rx="9" fill="#2563eb"/>

  <!-- punchline -->
  <rect x="48" y="492" width="1104" height="40" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="600" y="518" font-size="15" font-weight="600" fill="#334155" text-anchor="middle">Same whole-company price — "10k cheaper than 100k" compares slices of different pizzas</text>
</svg>
