<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" font-family="'Noto Sans','Helvetica Neue',Arial,sans-serif">
  <!-- outer card -->
  <rect x="8" y="8" width="1184" height="624" rx="20" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>

  <!-- title -->
  <text x="48" y="58" font-size="26" font-weight="700" fill="#0f172a">One year of profit, sliced two ways</text>
  <text x="48" y="84" font-size="15" fill="#64748b">Fiscal year 2025, audited annual reports — same profit, different slice counts</text>

  <!-- FPT card -->
  <rect x="48" y="108" width="536" height="424" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <rect x="48" y="108" width="536" height="52" rx="16" fill="#eef2ff"/>
  <rect x="48" y="148" width="536" height="12" fill="#eef2ff"/>
  <text x="80" y="142" font-size="21" font-weight="700" fill="#312e81">FPT Corporation</text>
  <rect x="474" y="120" width="82" height="28" rx="14" fill="#ffffff" stroke="#c7d2fe"/>
  <text x="515" y="139" font-size="13" font-weight="600" fill="#4f46e5" text-anchor="middle">HOSE: FPT</text>

  <text x="80" y="204" font-size="15" fill="#64748b">Profit for the year</text>
  <text x="552" y="206" font-size="25" font-weight="700" fill="#0f172a" text-anchor="end">9,376 billion VND</text>

  <text x="80" y="262" font-size="15" fill="#64748b">Shares outstanding</text>
  <text x="552" y="264" font-size="25" font-weight="700" fill="#0f172a" text-anchor="end">1,703,507,121</text>

  <line x1="80" y1="290" x2="552" y2="290" stroke="#e2e8f0" stroke-dasharray="4 4"/>

  <text x="80" y="322" font-size="15" fill="#64748b">Profit per share  (profit ÷ shares)</text>
  <text x="552" y="324" font-size="25" font-weight="700" fill="#4f46e5" text-anchor="end">≈ 5,504 VND</text>
  <text x="80" y="344" font-size="12" fill="#94a3b8">derived: 9,376 bn ÷ 1,703,507,121 shares</text>

  <text x="80" y="400" font-size="15" fill="#64748b">Cash dividend per share</text>
  <text x="552" y="402" font-size="25" font-weight="700" fill="#0f172a" text-anchor="end">2,000 VND</text>

  <!-- payout pictogram: 36% of profit paid out -->
  <text x="80" y="456" font-size="13" fill="#64748b">Dividend payout, share of the year's profit</text>
  <rect x="80" y="468" width="472" height="18" rx="9" fill="#e2e8f0"/>
  <rect x="80" y="468" width="170" height="18" rx="9" fill="#4f46e5"/>
  <text x="262" y="482" font-size="13" font-weight="600" fill="#4f46e5">≈ 36%</text>
  <text x="80" y="512" font-size="12" fill="#94a3b8">two installments of 1,000 VND each — Dec 2025 and Jun 2026</text>

  <!-- VNM card -->
  <rect x="616" y="108" width="536" height="424" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <rect x="616" y="108" width="536" height="52" rx="16" fill="#f0fdfa"/>
  <rect x="616" y="148" width="536" height="12" fill="#f0fdfa"/>
  <text x="648" y="142" font-size="21" font-weight="700" fill="#134e4a">Vinamilk</text>
  <rect x="1042" y="120" width="82" height="28" rx="14" fill="#ffffff" stroke="#99f6e4"/>
  <text x="1083" y="139" font-size="13" font-weight="600" fill="#0d9488" text-anchor="middle">HOSE: VNM</text>

  <text x="648" y="204" font-size="15" fill="#64748b">Profit for the year</text>
  <text x="1120" y="206" font-size="25" font-weight="700" fill="#0f172a" text-anchor="end">9,414 billion VND</text>

  <text x="648" y="262" font-size="15" fill="#64748b">Shares outstanding</text>
  <text x="1120" y="264" font-size="25" font-weight="700" fill="#0f172a" text-anchor="end">2,089,955,445</text>

  <line x1="648" y1="290" x2="1120" y2="290" stroke="#e2e8f0" stroke-dasharray="4 4"/>

  <text x="648" y="322" font-size="15" fill="#64748b">Profit per share  (profit ÷ shares)</text>
  <text x="1120" y="324" font-size="25" font-weight="700" fill="#0d9488" text-anchor="end">≈ 4,504 VND</text>
  <text x="648" y="344" font-size="12" fill="#94a3b8">derived: 9,414 bn ÷ 2,089,955,445 shares</text>

  <text x="648" y="400" font-size="15" fill="#64748b">Cash dividend per share</text>
  <text x="1120" y="402" font-size="25" font-weight="700" fill="#0f172a" text-anchor="end">4,350 VND</text>

  <!-- payout pictogram: 97% of profit paid out -->
  <text x="648" y="456" font-size="13" fill="#64748b">Dividend payout, share of the year's profit</text>
  <rect x="648" y="468" width="472" height="18" rx="9" fill="#e2e8f0"/>
  <rect x="648" y="468" width="458" height="18" rx="9" fill="#0d9488"/>
  <text x="648" y="512" font-size="12" fill="#94a3b8">≈ 97% paid out — the highest payout since 2018, a deliberate exception</text>

  <!-- formula strip -->
  <rect x="48" y="556" width="560" height="40" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="328" y="582" font-size="15" fill="#334155" text-anchor="middle" font-weight="600">Market cap = price × shares outstanding</text>
  <rect x="632" y="556" width="520" height="40" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="892" y="582" font-size="15" fill="#334155" text-anchor="middle" font-weight="600">EPS = profit ÷ shares outstanding</text>
</svg>
